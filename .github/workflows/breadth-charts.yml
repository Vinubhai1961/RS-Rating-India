# Save as .github/workflows/breadth-charts.yml
# Regenerates charts/*.png from the breadth CSV and commits them back,
# so the images in your README are always current.

name: Breadth Charts

on:
  push:
    paths:
      - "market_breadth_*.csv"
      - "breadth_chart.py"
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST on weekdays -- adjust to taste
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas matplotlib

      - name: Generate PNGs
        run: |
          CSV=$(ls -1 market_breadth_*.csv | sort | tail -1)
          echo "Using $CSV"
          python breadth_chart.py "$CSV" --outdir charts

      - name: Commit charts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/*.png
          git diff --staged --quiet || git commit -m "chore: refresh breadth charts [skip ci]"
          git push
