name: Find Top Gainers

# Two ways in:
#   workflow_call     - called from the master/RS workflow. Passing inputs is
#                       optional; every input has a default, so a bare
#                       `uses: ./.github/workflows/find_gainers.yml` works.
#   workflow_dispatch - manual run from the Actions tab.
#
# IMPORTANT: workflow_dispatch defaults do NOT carry over to workflow_call runs.
# The inputs must be declared under both triggers, which is why the block below
# is duplicated. Keep the two default sets in sync if you change them.
on:
  workflow_call:
    inputs:
      min_gain:
        description: "Minimum percent gain to qualify"
        required: false
        default: "5"
        type: string
      min_price:
        description: "Optional price floor to drop penny-stock noise (0 = off)"
        required: false
        default: "0"
        type: string
      min_rs_percentile:
        description: "Minimum RS Percentile to keep (0 = off)"
        required: false
        default: "60"
        type: string
      exclude_etf:
        description: "Exclude ETFs from the scan"
        required: false
        default: false
        type: boolean
      commit_results:
        description: "Commit the gainer/ output back to the repo"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      min_gain:
        description: "Minimum percent gain to qualify"
        required: false
        default: "5"
        type: string
      min_price:
        description: "Optional price floor to drop penny-stock noise (0 = off)"
        required: false
        default: "0"
        type: string
      min_rs_percentile:
        description: "Minimum RS Percentile to keep (0 = off)"
        required: false
        default: "60"
        type: string
      exclude_etf:
        description: "Exclude ETFs from the scan"
        required: false
        default: false
        type: boolean
      commit_results:
        description: "Commit the gainer/ output back to the repo"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: find-gainers
  cancel-in-progress: false

jobs:
  gainers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Belt-and-braces defaults. If this workflow is ever invoked in a way that
    # leaves the string inputs empty, these keep the CLI args valid.
    env:
      MIN_GAIN: ${{ inputs.min_gain || '5' }}
      MIN_PRICE: ${{ inputs.min_price || '0' }}
      MIN_RS_PERCENTILE: ${{ inputs.min_rs_percentile || '60' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Verify source file exists
        run: |
          if [ ! -f "RS_Data/rs_stocks.csv" ]; then
            echo "::error::RS_Data/rs_stocks.csv not found. Run the RS workflow first."
            exit 1
          fi
          echo "Source rows: $(( $(wc -l < RS_Data/rs_stocks.csv) - 1 ))"
          head -1 RS_Data/rs_stocks.csv

      - name: Prepare gainer output folder
        run: |
          # Created on the first run, reused on every run after that.
          if [ -d "gainer" ]; then
            echo "gainer/ already exists - reusing it."
            echo "Existing files: $(ls -1 gainer | wc -l)"
          else
            mkdir -p gainer
            echo "Created gainer/ folder."
          fi

      - name: Run gainer scan
        run: |
          ARGS="--input RS_Data/rs_stocks.csv --output-dir gainer"
          ARGS="$ARGS --min-gain ${MIN_GAIN}"
          ARGS="$ARGS --min-price ${MIN_PRICE}"
          ARGS="$ARGS --min-rs-percentile ${MIN_RS_PERCENTILE}"
          if [ "${{ inputs.exclude_etf }}" = "true" ]; then
            ARGS="$ARGS --exclude-etf"
          fi
          echo "Running: python scripts/find_gainers.py $ARGS"
          python scripts/find_gainers.py $ARGS | tee gainer_run.log

          # Surface the headline numbers in the Actions run summary.
          {
            echo "## Top Gainers Scan"
            echo ""
            echo '```'
            sed -n '/=== GAINERS/,$p' gainer_run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gainer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gainers-${{ github.run_number }}
          path: gainer/
          if-no-files-found: error
          retention-days: 30

      - name: Commit results
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gainer/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Gainers scan (>= ${MIN_GAIN}%, RS > ${MIN_RS_PERCENTILE}) - $(date -u +'%Y-%m-%d')"
            # Rebase in case the master workflow committed while this job ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
